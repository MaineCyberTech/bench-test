name: Runner diagnostic

# Temporary, read-only disk diagnostic for the public-repo runner. Safe to run
# manually; it does not modify the runner or the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disk:
    runs-on: [self-hosted, Linux, X64, lab, lab-docker, ci-runner]
    steps:
      - name: Disk and cache report
        run: |
          set -euo pipefail
          echo "== identity =="
          id
          echo "== filesystems =="
          df -h
          df -i
          echo "== workspace usage =="
          df -h .
          du -xhd2 "$HOME" 2>/dev/null | sort -h | tail -25
          echo "== runner work dirs =="
          du -xhd1 "$HOME/actions-runner/_work" 2>/dev/null | sort -h | tail -20
          echo "== docker =="
          docker system df 2>&1 || true
          echo "== largest files under home (top 20) =="
          find "$HOME" -xdev -type f -printf '%s %p\n' 2>/dev/null | sort -n | tail -20
