name: Build app bundles

# Builds standalone bench-test app bundles (GUI / TUI / agent) with PyInstaller
# for Windows and Linux, and attaches them to a release, so the dashboards can be
# run on other systems without installing Python.
#
# Trigger: push to main touching bench/**, packaging/** or this file, or manual
# dispatch. Download: gh release download app-<run> -p '*.zip'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "packaging/**"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # PERF-P2-003: reuse the pip download cache between runs instead of
          # re-fetching pyinstaller / windows-curses every build. There is no
          # lockfile yet (SBOM-P2-001), so key the cache on the build script and
          # this workflow (the inputs that decide what gets installed).
          cache: pip
          cache-dependency-path: |
            packaging/build_app.py
            .github/workflows/build-app.yml

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip pyinstaller
          if [ "${{ matrix.label }}" = "linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
          else
            # CPython on Windows has no _curses; the TUI bundle needs this wheel.
            python -m pip install --quiet windows-curses
          fi

      - name: Build bundles
        shell: bash
        env:
          # SEC-P0-001: public bundles must not carry the operator token. Prefer a
          # registration-only config (BENCHD_JOIN_TOKEN=...); BENCH_AGENT_CONF is
          # only used when it does not contain BENCHD_TOKEN=.
          BENCH_BAKE_AGENT_CONF: ${{ secrets.BENCH_AGENT_JOIN_CONF || secrets.BENCH_AGENT_CONF }}
        run: |
          set -euo pipefail
          if printf '%s\n' "${BENCH_BAKE_AGENT_CONF:-}" | grep -qE '^[[:space:]]*BENCHD_TOKEN='; then
            echo "ERROR: refusing to bake an operator token (BENCHD_TOKEN=) into a public app bundle." >&2
            echo "Create BENCH_AGENT_JOIN_CONF with BENCHD_JOIN_TOKEN=... instead." >&2
            exit 1
          fi
          python packaging/build_app.py --out dist

      - name: Package
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          # zip(1) is absent on the Windows runners, so archive with stdlib Python
          python - <<'PY'
          import os, zipfile
          label = os.environ["LABEL"]
          zpath = "bench-app-%s.zip" % label
          with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
              for d in ("bench-gui", "bench-tui", "bench-agent"):
                  for root, _dirs, files in os.walk(os.path.join("dist", d)):
                      for f in files:
                          p = os.path.join(root, f)
                          z.write(p, os.path.relpath(p, "dist"))
          print("wrote", zpath, os.path.getsize(zpath), "bytes")
          PY
          ls -lh bench-app-${{ matrix.label }}.zip

      - name: Smoke-verify bundles (TEST-P2-001)
        # A published bundle must actually run. Launch each packaged binary's
        # argument parser (--help exits before curses/tkinter start) and assert the
        # bundle carries its toolkit + version stamp, so a broken freeze fails the
        # job before anything is attached to a release.
        #
        # Python (not bash) drives it so the same check runs on both runners, each
        # launch is bounded (a hanging bundle fails instead of hanging the job) and
        # a failure prints the bundle's own output instead of swallowing it. The
        # GUI builds a Tk root, so Linux runs it under xvfb.
        shell: python
        run: |
          import os, subprocess, sys
          label = "${{ matrix.label }}"
          exe = ".exe" if label == "windows" else ""
          prefix = ["xvfb-run", "-a"] if label == "linux" else []
          bad = 0
          for app in ("bench-tui", "bench-gui", "bench-agent"):
              binp = os.path.abspath(os.path.join("dist", app, app + exe))
              checks = ((binp, "bundle binary"),
                        (os.path.join("dist", app, "bench"), "bundled toolkit"),
                        (os.path.join("dist", app, "VERSION"), "VERSION stamp"))
              missing = [what for path, what in checks if not os.path.exists(path)]
              if missing:
                  print("::error::%s is missing its %s" % (app, ", ".join(missing)))
                  bad = 1
                  continue
              try:
                  r = subprocess.run(prefix + [binp, "--help"], capture_output=True,
                                     text=True, timeout=120)
              except subprocess.TimeoutExpired:
                  print("::error::%s --help timed out after 120s - the bundle hangs" % app)
                  bad = 1
                  continue
              if r.returncode != 0:
                  print("::error::%s --help failed (rc=%d) - the bundle does not run"
                        % (app, r.returncode))
                  print(((r.stdout or "") + (r.stderr or ""))[-1500:])
                  bad = 1
              else:
                  print("smoke ok: %s" % app)
          sys.exit(1 if bad else 0)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-app-${{ matrix.label }}
          path: bench-app-${{ matrix.label }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    # the only job that writes: it attaches the release assets
    permissions:
      contents: write       # softprops/action-gh-release
      id-token: write       # SBOM-P2-003: OIDC token for build provenance
      attestations: write   # SBOM-P2-003: persist the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: ver
        run: |
          set -euo pipefail
          # REL-P2-002 / REL-P2-005: bind the release to a build - the version,
          # full commit SHA, branch and build date all go into the title/body.
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "sha7=$(printf '%s' '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Attest app bundles (SBOM-P2-003)
        # SBOM-P2-003: releases carried no build provenance. Sign the exact
        # bundles attached below so a download can be traced back to this
        # workflow run and commit (`gh attestation verify`).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: app-${{ github.run_number }}
          name: "App bundles v${{ steps.ver.outputs.version }} #${{ github.run_number }} (${{ steps.ver.outputs.sha7 }})"
          files: dist/*.zip
          make_latest: false
          body: |
            bench-test v${{ steps.ver.outputs.version }} standalone app bundles (PyInstaller) — run the GUI/TUI/agent
            without installing Python.
            - **Version:** `${{ steps.ver.outputs.version }}` (VERSION)
            - **Commit:** `${{ steps.ver.outputs.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Built:** ${{ steps.ver.outputs.date }} (UTC)
            - `bench-app-windows.zip` · `bench-app-linux.zip`
            Unzip, then run `bench-gui`, `bench-tui` or `bench-agent`.
            Connecting to a control plane needs no other install; running a local
            battery needs a toolkit checkout (`$BENCH_REPO`).
