name: Build live ISO

# Builds the bench-test live ISO on a self-hosted runner and attaches it to a
# GitHub release, so the machine with the USB stick can just download + flash.
#
# Runner requirements (Arch Linux):
#   - passwordless sudo (`sudo -n true` must pass; mkarchiso needs root)
#   - python 3.14 with venv + pip, network access (pacman + PyTorch wheels)
#   - >= 40 GiB free on /var/tmp
#
# Trigger: Actions tab -> "Build live ISO" -> Run workflow (pick the variant),
# or automatically on pushes to main touching bench/** or live/** (defaults:
# nvidia-legacy + zstd + ubuntu-latest).
# Download afterwards:  gh release download iso-<gpu>-<run> -p '*.iso'
# or via the API/UI; the SHA256SUMS asset verifies the transfer.

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU variant"
        type: choice
        options: [nvidia-legacy, nvidia, amd, hybrid]
        default: nvidia-legacy
      compression:
        description: "squashfs compression (zstd = faster build, larger ISO)"
        type: choice
        options: [zstd, xz]
        default: zstd
      runner_labels:
        description: "JSON array of runner labels (ubuntu-latest = free for public repos, 74G scratch)"
        default: '["ubuntu-latest"]'
      upload_release:
        description: "Attach the ISO to a GitHub release"
        type: boolean
        default: true

  push:
    branches: [main]
    paths:
      - "bench/**"
      - "live/**"

permissions:
  contents: write

concurrency:
  group: build-iso-${{ inputs.gpu || 'nvidia-legacy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install upload credentials (opt-in only)
        run: |
          # SECRET-P1-002 / FINAL-P0-002: the repo and its ISO releases are public,
          # so a write-capable upload token baked here is world-readable. Baking is
          # opt-in via the repository variable BENCH_BAKE_UPLOAD_TOKEN=true; the
          # image works without it (configure the token at runtime instead).
          if [ "${{ vars.BENCH_BAKE_UPLOAD_TOKEN }}" != "true" ]; then
            echo "not baking upload credentials (set the BENCH_BAKE_UPLOAD_TOKEN repo variable to opt in)"
            exit 0
          fi
          if [ -n "${{ secrets.BENCH_UPLOAD_CONF }}" ]; then
            mkdir -p live/private
            printf '%s\n' "${{ secrets.BENCH_UPLOAD_CONF }}" > live/private/bench-upload.conf
            chmod 600 live/private/bench-upload.conf
            echo "WARNING: upload credentials baked into a PUBLIC image (opt-in)"
          else
            echo "no BENCH_UPLOAD_CONF secret set - image carries no upload credentials"
          fi

      - name: Install control-plane config (registration-only join token)
        run: |
          # SEC-P0-001 / FINAL-P0-001: never bake the operator token into a public
          # artifact. Prefer BENCH_AGENT_JOIN_CONF (BENCHD_JOIN_TOKEN=...); refuse a
          # config that carries BENCHD_TOKEN=.
          CONF="${{ secrets.BENCH_AGENT_JOIN_CONF }}"
          if [ -z "$CONF" ]; then
            CONF="${{ secrets.BENCH_AGENT_CONF }}"
          fi
          if [ -z "$CONF" ]; then
            echo "no control-plane config secret set - image will not auto-connect"
            exit 0
          fi
          if printf '%s\n' "$CONF" | grep -qE '^[[:space:]]*BENCHD_TOKEN='; then
            echo "ERROR: refusing to bake an operator token (BENCHD_TOKEN=) into a public ISO." >&2
            echo "Create BENCH_AGENT_JOIN_CONF with BENCHD_JOIN_TOKEN=... instead." >&2
            exit 1
          fi
          mkdir -p live/private
          printf '%s\n' "$CONF" > live/private/bench-agent.conf
          chmod 600 live/private/bench-agent.conf
          echo "registration-only control-plane config baked into the image (auto check-in on boot)"

      - name: Requirements check
        run: |
          set -euo pipefail
          echo "user: $(id -un)  uid: $(id -u)"
          sudo -n true && echo "passwordless sudo: ok" || { echo "ERROR: sudo -n unavailable"; exit 1; }
          df -BG --output=avail /var/tmp | tail -1
          python3 --version

      - name: Build ISO (${{ inputs.gpu }})
        run: |
          set -euo pipefail
          bash live/ci-build.sh ${{ inputs.gpu || 'nvidia-legacy' }} ${{ inputs.compression || 'zstd' }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$ISO_PATH" "dist/bench-live-${{ inputs.gpu || 'nvidia-legacy' }}.iso"
          sha256sum dist/*.iso | tee dist/SHA256SUMS
          cp VERSION dist/bench-version.txt
          du -h dist/*.iso
          # GitHub release assets are capped at 2 GiB; ship <2GiB parts
          split -b 1900M "dist/bench-live-${{ inputs.gpu || 'nvidia-legacy' }}.iso" "dist/bench-live-${{ inputs.gpu || 'nvidia-legacy' }}.iso.part."
          rm "dist/bench-live-${{ inputs.gpu || 'nvidia-legacy' }}.iso"
          cat > dist/README-ASSEMBLE.txt <<'EOF'
          Reassemble and verify:
            cat bench-live-<gpu>.iso.part.* > bench-live-<gpu>.iso
            sha256sum -c SHA256SUMS
          EOF

      - name: Attach to release
        if: ${{ inputs.upload_release == '' || inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ inputs.gpu || 'nvidia-legacy' }}-${{ github.run_number }}
          name: "ISO ${{ inputs.gpu || 'nvidia-legacy' }} v${{ steps.ver.outputs.version }} #${{ github.run_number }}"
          files: |
            dist/bench-live-${{ inputs.gpu || 'nvidia-legacy' }}.iso.part.*
            dist/SHA256SUMS
            dist/README-ASSEMBLE.txt
            dist/bench-version.txt
          make_latest: false
          body: |
            bench-test **v${{ steps.ver.outputs.version }}** live ISO — self-hosted build of the `${{ inputs.gpu || 'nvidia-legacy' }}` variant (run ${{ github.run_number }}, ${{ inputs.compression || 'zstd' }} squashfs).
            Built from commit `${{ github.sha }}` on `${{ github.ref_name }}` — the tag's run number does **not** map to a commit, so check this before flashing.
            Assets are <2 GiB parts (GitHub's release asset cap):
            `cat bench-live-${{ inputs.gpu }}.iso.part.* > bench-live-${{ inputs.gpu }}.iso && sha256sum -c SHA256SUMS`
            then flash with `sudo dd if=bench-live-${{ inputs.gpu }}.iso of=/dev/sdX bs=4M conv=fsync status=progress`.
