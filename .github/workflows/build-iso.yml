name: Build live ISO

# Builds the bench-test live ISO on a self-hosted runner and attaches it to a
# GitHub release, so the machine with the USB stick can just download + flash.
#
# Runner requirements (Arch Linux):
#   - passwordless sudo (`sudo -n true` must pass; mkarchiso needs root)
#   - python 3.14 with venv + pip, network access (pacman + PyTorch wheels)
#   - >= 40 GiB free on /var/tmp
#
# Trigger: Actions tab -> "Build live ISO" -> Run workflow (pick the variant).
# Download afterwards:  gh release download iso-<gpu>-<run> -p '*.iso'
# or via the API/UI; the SHA256SUMS asset verifies the transfer.

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU variant"
        type: choice
        options: [nvidia-legacy, nvidia, amd]
        default: nvidia-legacy
      compression:
        description: "squashfs compression (zstd = faster build, larger ISO)"
        type: choice
        options: [zstd, xz]
        default: zstd
      runner_labels:
        description: "JSON array of runner labels (ubuntu-latest = free for public repos, 74G scratch)"
        default: '["ubuntu-latest"]'
      upload_release:
        description: "Attach the ISO to a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-iso-${{ inputs.gpu }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install upload credentials (optional secret)
        run: |
          if [ -n "${{ secrets.BENCH_UPLOAD_CONF }}" ]; then
            mkdir -p live/private
            printf '%s\n' "${{ secrets.BENCH_UPLOAD_CONF }}" > live/private/bench-upload.conf
            chmod 600 live/private/bench-upload.conf
            echo "upload credentials baked into the image"
          else
            echo "no BENCH_UPLOAD_CONF secret set - image carries no upload credentials"
          fi

      - name: Install control-plane config (optional secret)
        run: |
          if [ -n "${{ secrets.BENCH_AGENT_CONF }}" ]; then
            mkdir -p live/private
            printf '%s\n' "${{ secrets.BENCH_AGENT_CONF }}" > live/private/bench-agent.conf
            chmod 600 live/private/bench-agent.conf
            echo "control-plane config baked into the image (auto check-in on boot)"
          else
            echo "no BENCH_AGENT_CONF secret set - image will not auto-connect"
          fi

      - name: Requirements check
        run: |
          set -euo pipefail
          echo "user: $(id -un)  uid: $(id -u)"
          sudo -n true && echo "passwordless sudo: ok" || { echo "ERROR: sudo -n unavailable"; exit 1; }
          df -BG --output=avail /var/tmp | tail -1
          python3 --version

      - name: Build ISO (${{ inputs.gpu }})
        run: |
          set -euo pipefail
          bash live/ci-build.sh ${{ inputs.gpu }} ${{ inputs.compression }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$ISO_PATH" "dist/bench-live-${{ inputs.gpu }}.iso"
          sha256sum dist/*.iso | tee dist/SHA256SUMS
          du -h dist/*.iso
          # GitHub release assets are capped at 2 GiB; ship <2GiB parts
          split -b 1900M "dist/bench-live-${{ inputs.gpu }}.iso" "dist/bench-live-${{ inputs.gpu }}.iso.part."
          rm "dist/bench-live-${{ inputs.gpu }}.iso"
          cat > dist/README-ASSEMBLE.txt <<'EOF'
          Reassemble and verify:
            cat bench-live-<gpu>.iso.part.* > bench-live-<gpu>.iso
            sha256sum -c SHA256SUMS
          EOF

      - name: Attach to release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ inputs.gpu }}-${{ github.run_number }}
          name: "ISO ${{ inputs.gpu }} #${{ github.run_number }}"
          files: |
            dist/bench-live-${{ inputs.gpu }}.iso.part.*
            dist/SHA256SUMS
            dist/README-ASSEMBLE.txt
          make_latest: false
          body: |
            Self-hosted build of the `${{ inputs.gpu }}` live ISO (run ${{ github.run_number }}, ${{ inputs.compression }} squashfs).
            Assets are <2 GiB parts (GitHub's release asset cap):
            `cat bench-live-${{ inputs.gpu }}.iso.part.* > bench-live-${{ inputs.gpu }}.iso && sha256sum -c SHA256SUMS`
            then flash with `sudo dd if=bench-live-${{ inputs.gpu }}.iso of=/dev/sdX bs=4M conv=fsync status=progress`.
