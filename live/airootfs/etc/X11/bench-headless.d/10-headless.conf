# Headless nvidia X for NV-CONTROL (fan control) and offscreen GL (FurMark).
# Used only via  X ... -configdir /etc/X11/bench-headless.d  so the visible
# console and the GUI dashboard's own X are never modeset/blanked.
Section "Device"
    Identifier "bench-headless"
    Driver "nvidia"
    # NOTE: a server with no output/CRTC (UseDisplayDevice "none") starts fine and
    # glxinfo works, but window-based GL apps do not: FurMark segfaults (rc=139)
    # and glmark2 hangs/errors, so the gfx phase falls back and records why. The
    # run uploads $LOGDIR/gfx-diag.txt (xdpyinfo/xrandr/RESOURCE_MANAGER/glxinfo)
    # plus gfx-furmark.log and gfx-glmark2*.log, so the next attempt can start
    # from real diagnostics. Giving this server a virtual display (DFP-0 +
    # NoEdidModes: AllowNonEdidModes) was tried and did not produce an output, so
    # the working NV-CONTROL path is left as it is rather than changed blind.
    Option "UseDisplayDevice" "none"
EndSection
