[Unit]
# The tty1 dashboard always runs. The ttyS0 one is only useful when a serial console
# is actually wired up, and otherwise just runs an invisible second dashboard that
# registers a phantom runner. Two conditions, both verified against systemd 257:
#   * ConditionKernelCommandLine=console is a bare-word check, so it matches the plain
#     `console=ttyS0` AND the usual `console=ttyS0,115200`. The exact form
#     `console=ttyS0` does not match the baud form, and systemd has no prefix form for
#     this condition (`console:ttyS0` and `console=ttyS0*` both evaluate false).
#   * ConditionPathExists=/dev/ttyS0 keeps the dashboard off a machine with no serial
#     port at all.
# Add `console=ttyS0,115200` to the boot cmdline for headless use.
ConditionKernelCommandLine=console
ConditionPathExists=/dev/ttyS0
