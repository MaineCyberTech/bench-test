[Unit]
# The tty1 dashboard always runs. The ttyS0 one is only useful when a serial
# console is actually wired up, and otherwise just runs an invisible second
# dashboard that registers a phantom runner — so require the kernel to be
# configured for it (add `console=ttyS0` to the boot cmdline for headless use).
ConditionKernelCommandLine=console=ttyS0
