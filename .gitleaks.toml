# gitleaks configuration (DET-P2-005 / SC-P1-002).
#
# The default ruleset stays fully active; the two allowlists below cover values
# that the generic-api-key rule flags in this repository's history but which are
# not credentials. Each entry is scoped to one file and one literal, so the rule
# still fires for anything else.
[extend]
useDefault = true

[[allowlists]]
description = "placeholder api_key in a control-plane test fixture"
paths = ['''tests/test_control_plane\.py$''']
regexTarget = "match"
regexes = ['''rotated-key-123''']

[[allowlists]]
description = "actions/cache key name, not a secret"
paths = ['''\.github/workflows/build-iso\.yml$''']
regexTarget = "match"
regexes = ['''pip-torch-cu126-v1''']
